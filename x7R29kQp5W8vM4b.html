<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Status - Admin</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background-color: #f4f5f7; color: #333333; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #ffffff; padding: 25px 40px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; color: #1a202c; letter-spacing: 2px; font-weight: bold; }
        .admin-badge { background-color: #e2e8f0; color: #4a5568; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .main-container { max-width: 1000px; width: 100%; margin: 0 auto; padding: 40px; box-sizing: border-box; flex: 1; }
        .control-panel { background-color: #fff; border: 2px solid #e2e8f0; border-radius: 8px; padding: 30px; margin-bottom: 40px; text-align: left; }
        .panel-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #1a202c; }
        .control-group { margin-bottom: 25px; }
        .control-label { font-size: 14px; font-weight: bold; color: #4a5568; margin-bottom: 10px; }
        .radio-group { display: flex; gap: 15px; }
        .radio-label { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: bold; cursor: pointer; background: #f7fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; flex: 1; transition: all 0.2s; box-sizing: border-box; }
        .radio-label:hover { background: #edf2f7; }
        .radio-label input { width: 18px; height: 18px; cursor: pointer; }
        .input-text { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px; box-sizing: border-box; background: #f7fafc; }
        .input-text:focus { border-color: #3182ce; background: #fff; outline: none; }
        .save-btn { width: 100%; padding: 15px; background-color: #3182ce; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .save-btn:hover { background-color: #2b6cb0; }
        .save-btn:active { transform: scale(0.99); }
    </style>
</head>
<body>

    <header>
        <h1>MY STATUS</h1>
        <span class="admin-badge">ADMIN MODE</span>
    </header>

    <div class="main-container">
        <div class="control-panel">
            <div class="panel-title">⚙️ ステータス＆ニュース管理</div>
            
            <div class="control-group">
                <div class="control-label">1. 今の状態を選択</div>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="status" value="online" checked>🟢 はなせる</label>
                    <label class="radio-label"><input type="radio" name="status" value="offline">🔴 ねてる</label>
                </div>
            </div>

            <div class="control-group">
                <div class="control-label">2. ハッシュタグ（カンマ区切りで入力）</div>
                <input type="text" id="inputTags" class="input-text" value="暇つぶし,ねむい,カカオおる">
            </div>

            <div class="control-group">
                <div class="control-label">3. 最近の出来事を追加（一番上にどんどん蓄積されるよ）</div>
                <input type="text" id="inputNews" class="input-text" value="">
            </div>

            <button id="saveBtn" class="save-btn">変更を保存して反映する</button>
        </div>
    </div>

    <script>
        const GITHUB_USER = "keitoet";
        const GITHUB_REPO = "my-status";
        const CLIENT_ID = "Ov23linEGDzqnxpRANnO";

        document.getElementById('saveBtn').addEventListener('click', () => {
            const status = document.querySelector('input[name="status"]:checked').value;
            const tags = document.getElementById('inputTags').value.split(',').map(t => t.trim());
            const newsText = document.getElementById('inputNews').value;
            
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "同期中...";

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            // 💡 認証がまだの場合は1回だけジャンプ、通過済みの場合はそのまま通信
            if (!code) {
                window.location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&scope=repo&redirect_uri=${encodeURIComponent(window.location.href)}`;
                return;
            }

            fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/dispatches`, {
                method: "POST",
                headers: {
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/vnd.github.v3+json",
                    "Authorization": `token ${code}`
                },
                body: JSON.stringify({
                    event_type: "update-status",
                    client_payload: {
                        status: status,
                        tags: JSON.stringify(tags),
                        news: newsText
                    }
                })
            })
            .then(res => {
                if (res.status === 204 || res.status === 202) {
                    alert("反映完了！約1分ほどでフォロワーの画面が自動で書き換わります。");
                    document.getElementById('inputNews').value = ""; // 入力欄を空にする
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else {
                    window.location.href = window.location.pathname;
                }
            })
            .catch(() => alert("通信エラーが発生しました。"))
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "変更を保存して反映する";
            });
        });
    </script>

</body>
</html>
