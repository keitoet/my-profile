<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ステータス更新</title>
    <!-- スマホでアプリっぽく見せる設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <p>ステータスを更新中...</p>

    <script>
    window.onload = async () => {
        // 1. 今「話せる(true)」にするか「話せない(false)」にするかを選択
        const onlineInput = confirm("今から「話せる（オンライン）」にしますか？\n【OK】= 話せる / 【キャンセル】= 話せない");
        
        let tagsArray = [];
        
        // 2. 話せない（false）の場合だけ、理由（タグ）を入力してもらう
        if (!onlineInput) {
            const reasonInput = prompt("話せない理由（タグ）をカンマ区切りで入力してください\n（例: 話せない,作業中,1日中無理）");
            if (reasonInput) {
                tagsArray = reasonInput.split(',').map(t => t.trim());
            } else {
                tagsArray = ["話せない"]; // 入力がない場合のデフォルト
            }
        }

        // 3. microCMSのAPIへデータを送信して書き換える
        // ※URLとAPIキー（X-WRITE-API-KEY）はmicroCMSで発行されたものに書き換えます
        await fetch('https://YOUR_SPACE.microcms.io/api/v1/status', {
            method: 'PATCH',
            headers: {
                'X-WRITE-API-KEY': 'あなたの書き込み用APIキー',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                isOnline: onlineInput,
                tags: tagsArray
            })
        });

        alert("ステータスを更新しました！");
        window.close(); // スマホの画面を閉じる（PWA化している場合有効）
    };
    </script>
</body>
</html>
