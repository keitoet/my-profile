<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ステータス変更画面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 80vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        h2 { margin-top: 0; font-size: 20px; text-align: center; margin-bottom: 25px; }
        .radio-group { display: flex; gap: 15px; margin-bottom: 25px; }
        .radio-label { flex: 1; text-align: center; padding: 12px; border: 2px solid #ccc; border-radius: 8px; cursor: pointer; font-weight: bold; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label.online { border-color: #28a745; background: #e8f5e9; color: #28a745; }
        input[type="radio"]:checked + .radio-label.offline { border-color: #dc3545; background: #fdf2f2; color: #dc3545; }
        .input-label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 25px; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>ステータスを変更する</h2>
    
    <div class="radio-group">
        <input type="radio" id="opt_online" name="online" value="true" checked>
        <label for="opt_online" class="radio-label online">🟢 話せる</label>
        
        <input type="radio" id="opt_offline" name="online" value="false">
        <label for="opt_offline" class="radio-label offline">🔴 話せない</label>
    </div>

    <label class="input-label">話せない理由（タグ・カンマ区切り）</label>
    <input type="text" id="tagsInput" value="話せない" placeholder="ゲーム中, 睡眠 など">

    <button id="saveBtn">ステータスを変更する</button>
</div>

<script>
// 画面を開いた時に、今保存されているデータを自動でセットする
window.addEventListener('DOMContentLoaded', () => {
    const savedStatus = localStorage.getItem('my_web_status');
    if (savedStatus) {
        const data = JSON.parse(savedStatus);
        if (data.isOnline) {
            document.getElementById('opt_online').checked = true;
        } else {
            document.getElementById('opt_offline').checked = true;
        }
        document.getElementById('tagsInput').value = data.tags ? data.tags.join(', ') : '';
    }
});

// ボタンを押したら、ブラウザの共有スペースにデータを保存する（トークン不要！）
document.getElementById('saveBtn').addEventListener('click', () => {
    const isOnline = document.getElementById('opt_online').checked;
    const tagsValue = document.getElementById('tagsInput').value;
    const tagsArray = isOnline ? [] : tagsValue.split(',').map(t => t.trim()).filter(Boolean);

    const statusData = {
        isOnline: isOnline,
        tags: tagsArray
    };

    // ブラウザにデータを保存（これでメインサイト側とデータが連動します）
    localStorage.setItem('my_web_status', JSON.stringify(statusData));
    
    alert("🟢 ステータスを変更しました！");
});
</script>

</body>
</html>
