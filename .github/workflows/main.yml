name: Update Status

on:
  repository_dispatch:
    types: [update-status]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Files
        run: |
          STATUS="${{ github.event.client_payload.status }}"
          TAGS='${{ github.event.client_payload.tags }}'
          NEWS="${{ github.event.client_payload.news }}"
          CURRENT_DATE=$(date +'%Y.%m.%d')
          
          if [ "$STATUS" = "online" ]; then
            SED_STATUS="true"
          else
            SED_STATUS="false"
          fi
          
          sed -i "s/updateStatus(.*);/updateStatus($SED_STATUS, $TAGS);/g" index.html
          
          if [ -n "$NEWS" ]; then
            NEW_LINE="        <li><span class=\"notice-date\">$CURRENT_DATE<\/span><span class=\"notice-text\">$NEWS<\/span><\/li>"
            sed -i "s|<ul id=\"newsList\" class=\"notice-list\">|<ul id=\"newsList\" class=\"notice-list\">\n$NEW_LINE|g" index.html
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Update status and accumulate news via admin panel"
          git push
