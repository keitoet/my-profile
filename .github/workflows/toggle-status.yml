name: Toggle Status JSON

on:
  repository_dispatch:
    types: [toggle_online, toggle_offline]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # オンライン（true）にする合図が来たら、tagsを空にしてisOnlineをtrueにする
      - name: Set Online
        if: github.event.action == 'toggle_online'
        run: |
          echo '{"isOnline": true, "tags": []}' > my-profile/status.json

      # オフライン（false）にする合図が来たら、スマホから送られてきた理由（タグ）を書き込む
      - name: Set Offline
        if: github.event.action == 'toggle_offline'
        run: |
          # スマホから届いた理由テキスト（例: "ゲーム中,作業中"）をJSONの配列形式に変換
          TAGS_JSON=$(echo "${{ github.event.client_payload.reasons }}" | jq -R 'split(",") | map(trimstring(" "))')
          echo "{\"isOnline\": false, \"tags\": $TAGS_JSON}" > my-profile/status.json

      # 変更されたstatus.jsonを自動でコミットして保存する
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add my-profile/status.json
          git commit -m "スマホからステータスを自動更新"
          git push
